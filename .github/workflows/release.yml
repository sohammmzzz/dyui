name: Release to PyPI

# Push a tag like v1.0.0 to build the wheel (with the compiled web app inside)
# and publish it with PyPI trusted publishing (configure the publisher on PyPI first).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: web
      # Build the web app into python/dyui/_static FIRST: `python -m build` makes the sdist,
      # then builds the wheel from the unpacked sdist (where ../web doesn't exist), so the UI
      # must already be in the source tree for both artifacts to carry it.
      - name: Build web app into the Python package
        run: npm run build:py
        working-directory: web
      - name: Generate the PyPI README from the root README
        run: python scripts/sync_pypi_readme.py
      - run: pip install build
      - name: Build sdist + wheel
        run: python -m build python --outdir dist
        env:
          DYUI_SKIP_WEB_BUILD: "1"
      - name: Check both artifacts ship the web UI
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          whl = glob.glob("dist/*.whl")[0]; sdist = glob.glob("dist/*.tar.gz")[0]
          assert any(n.endswith("dyui/_static/index.html") for n in zipfile.ZipFile(whl).namelist()), whl
          assert any(n.endswith("dyui/_static/index.html") for n in tarfile.open(sdist).getnames()), sdist
          print("ok:", whl, sdist)
          PY
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/dyui version
          /tmp/smoke/bin/python -c "import dyui, pathlib; p = pathlib.Path(dyui.__file__).parent / '_static' / 'index.html'; assert p.exists(), p"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
