<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0C10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>DyUI</title>
    <!-- external (not inline) so the app runs under a strict script-src CSP -->
    <script src="./boot.js"></script>
    <link rel="stylesheet" href="./boot.css" />
  </head>
  <body>
    <!-- Loading splash: the DyUI mark assembles (dot, dot, card) from the first paint, before the
         app bundle arrives. Styled by boot.css; App.tsx fades it out once the app is ready. -->
    <div id="dy-splash" aria-hidden="true">
      <svg class="dy-splash-mark" viewBox="0 23 100 54" width="104" height="56" focusable="false">
        <circle class="dy-splash-dot" cx="11" cy="50" r="9" />
        <circle class="dy-splash-dot" cx="35" cy="50" r="9" />
        <path class="dy-splash-card" d="M66 25H84A14 14 0 0 1 98 39V61A14 14 0 0 1 84 75H56A4 4 0 0 1 52 71V39A14 14 0 0 1 66 25Z" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
