[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dyui"
version = "1.2.0"
description = "Chatbots that answer in interfaces — the Python framework for professional generative-UI chat apps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DyUI contributors" }]
keywords = ["chatbot", "llm", "generative-ui", "chat", "ui", "langgraph", "openai", "anthropic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.120.1",
  # Security floors (transitive deps pinned directly so old, vulnerable releases can't resolve):
  "starlette>=0.49.1",          # CVE-2024-47874, CVE-2025-54121, CVE-2025-62727 (FileResponse Range DoS)
  "python-multipart>=0.0.27",   # CVE-2024-53981, CVE-2026-40347, CVE-2026-42561 (multipart DoS)
  "h11>=0.16.0",                # CVE-2025-43859 (request smuggling)
  "uvicorn[standard]>=0.29",
  "pydantic>=2.10",             # uses __pydantic_fields__ (2.10+)
  "watchfiles>=0.21",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
langgraph = ["langgraph>=1.0"]
all = ["openai>=1.40", "anthropic>=0.40", "langgraph>=1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
dyui = "dyui.cli:main"

[project.urls]
Homepage = "https://github.com/sohammmzzz/dyui"
Documentation = "https://sohammmzzz.github.io/dyui/"
Source = "https://github.com/sohammmzzz/dyui"

[tool.hatch.build.targets.wheel]
packages = ["dyui"]
artifacts = ["dyui/_static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["dyui", "hatch_build.py", "README.md"]
artifacts = ["dyui/_static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
