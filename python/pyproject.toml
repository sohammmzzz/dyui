[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dyui"
version = "0.1.0"
description = "A dynamic-UI layer for any LangGraph agent: emit live UI cards from any node or tool, with any LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soham Das", email = "sohamdas1300@gmail.com" }]
keywords = ["langgraph", "agents", "ui", "generative-ui", "llm", "sse", "fastapi", "dynamic-ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=0.2.40",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/sohammmzzz/dyui"
Repository = "https://github.com/sohammmzzz/dyui"
Issues = "https://github.com/sohammmzzz/dyui/issues"

[project.scripts]
dyui = "dyui.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = [
    "fastapi>=0.110",
    "uvicorn",
    "httpx",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["dyui"]
# Ship the bundled single-file UI (non-Python data) inside the wheel.
artifacts = ["dyui/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
