<!-- A custom HTML card template. {{ key }} = escaped prop, {{{ key }}} = raw. -->
<div style="display:flex;align-items:center;gap:14px">
  <div style="font-size:40px">{{{ emoji }}}</div>
  <div>
    <div style="font-size:13px;color:#8b949e">{{ city }}</div>
    <div style="font-size:30px;font-weight:800;line-height:1">{{ temp }}&deg;</div>
    <div style="font-size:12px;color:#38bdf8">{{ summary }}</div>
  </div>
</div>
