<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#0a0b0e"/>

  <!-- markdown card (violet) -->
  <g transform="translate(40, 40)" filter="url(#sh)">
    <rect width="260" height="220" rx="16" fill="#16191f" stroke="#2d333b"/>
    <rect width="3" height="220" rx="2" fill="#a78bfa"/>
    <circle cx="28" cy="34" r="9" fill="#a78bfa" opacity="0.25"/>
    <text x="46" y="39" font-size="13" font-weight="600" fill="#eef1f5">Plan</text>
    <text x="190" y="38" font-size="9" fill="#a78bfa" letter-spacing="1">DONE</text>
    <text x="24" y="84" font-size="19" fill="#eef1f5" font-family="Georgia, serif">Researching Berlin</text>
    <text x="24" y="120" font-size="13" fill="#cfd6df">&#8226; Search the corpus</text>
    <text x="24" y="146" font-size="13" fill="#cfd6df">&#8226; Score the sources</text>
    <text x="24" y="172" font-size="13" fill="#cfd6df">&#8226; Summarise findings</text>
  </g>

  <!-- stat card (teal) -->
  <g transform="translate(320, 40)" filter="url(#sh)">
    <rect width="260" height="220" rx="16" fill="#16191f" stroke="#2d333b"/>
    <rect width="3" height="220" rx="2" fill="#5eead4"/>
    <circle cx="28" cy="34" r="9" fill="#5eead4" opacity="0.25"/>
    <text x="46" y="39" font-size="13" font-weight="600" fill="#eef1f5">This month</text>
    <text x="186" y="38" font-size="9" fill="#5eead4" letter-spacing="1">DONE</text>
    <text x="24" y="135" font-size="58" font-weight="700" fill="#eef1f5" font-family="Georgia, serif">$48.2k</text>
    <text x="24" y="165" font-size="13" fill="#9aa3b0">Revenue</text>
    <text x="24" y="190" font-size="13" fill="#5eead4">&#9650; +12% vs last month</text>
  </g>

  <!-- progress card (amber) -->
  <g transform="translate(600, 40)" filter="url(#sh)">
    <rect width="260" height="220" rx="16" fill="#16191f" stroke="#2d333b"/>
    <rect width="3" height="220" rx="2" fill="#f5b544"/>
    <circle cx="28" cy="34" r="9" fill="#f5b544" opacity="0.25"/>
    <text x="46" y="39" font-size="13" font-weight="600" fill="#eef1f5">Summarising</text>
    <text x="176" y="38" font-size="9" fill="#f5b544" letter-spacing="1">WORKING</text>
    <text x="24" y="100" font-size="13" fill="#9aa3b0">chunk 7 / 10</text>
    <rect x="24" y="116" width="212" height="12" rx="6" fill="#21262d"/>
    <rect x="24" y="116" width="148" height="12" rx="6" fill="#f5b544"/>
    <rect x="24" y="150" width="212" height="12" rx="6" fill="#21262d"/>
    <rect x="24" y="150" width="92" height="12" rx="6" fill="#f5b544" opacity="0.6"/>
    <text x="24" y="196" font-size="12" fill="#9aa3b0">72% complete</text>
  </g>

  <!-- custom html / invoice card (coral) -->
  <g transform="translate(880, 40)" filter="url(#sh)">
    <rect width="280" height="220" rx="16" fill="#16191f" stroke="#2d333b"/>
    <rect width="3" height="220" rx="2" fill="#ff8a6b"/>
    <circle cx="28" cy="34" r="9" fill="#ff8a6b" opacity="0.25"/>
    <text x="46" y="39" font-size="13" font-weight="600" fill="#eef1f5">Invoice</text>
    <text x="206" y="38" font-size="9" fill="#ff8a6b" letter-spacing="1">CUSTOM HTML</text>
    <text x="24" y="86" font-size="11" fill="#8b949e">Invoice #1042</text>
    <text x="232" y="86" font-size="11" fill="#8b949e" text-anchor="end">2026-05-29</text>
    <text x="24" y="128" font-size="15" fill="#eef1f5">Berlin Books Ltd</text>
    <text x="256" y="132" font-size="30" font-weight="700" fill="#34d399" text-anchor="end" font-family="Georgia, serif">$1,284</text>
    <line x1="24" y1="150" x2="256" y2="150" stroke="#2d333b"/>
    <text x="24" y="178" font-size="11" fill="#9aa3b0">7 line items &#183; Paid</text>
  </g>
</svg>
