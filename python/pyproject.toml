[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dyui"
version = "1.0.0"
description = "Chatbots that answer in interfaces — the Python framework for professional generative-UI chat apps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DyUI contributors" }]
keywords = ["chatbot", "llm", "generative-ui", "chat", "ui", "langgraph", "openai", "anthropic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "watchfiles>=0.21",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
langgraph = ["langgraph>=0.2.60"]
all = ["openai>=1.40", "anthropic>=0.40", "langgraph>=0.2.60"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
dyui = "dyui.cli:main"

[project.urls]
Homepage = "https://github.com/sohammmzzz/dyui"
Documentation = "https://sohammmzzz.github.io/dyui/"
Source = "https://github.com/sohammmzzz/dyui"

[tool.hatch.build.targets.wheel]
packages = ["dyui"]
artifacts = ["dyui/_static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["dyui", "hatch_build.py", "README.md"]
artifacts = ["dyui/_static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
