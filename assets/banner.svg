<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b544"/>
      <stop offset="0.55" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d11"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="cardblur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>

  <!-- aurora blobs -->
  <g filter="url(#soft)" opacity="0.55">
    <circle cx="180" cy="90" r="150" fill="#f5b544"/>
    <circle cx="900" cy="320" r="170" fill="#5eead4"/>
    <circle cx="640" cy="40" r="120" fill="#ff8a6b"/>
  </g>
  <rect width="1200" height="380" rx="22" fill="#0a0b0e" opacity="0.35"/>

  <!-- wordmark + tagline -->
  <g transform="translate(72, 150)">
    <text x="0" y="0" font-size="92" font-weight="700" fill="url(#title)" letter-spacing="1">Dy<tspan font-style="italic">UI</tspan></text>
    <text x="4" y="52" font-size="25" fill="#cfd6df" font-family="Helvetica, Arial, sans-serif">Dynamic UI for <tspan fill="#f5b544">any</tspan> LangGraph agent.</text>
    <text x="4" y="92" font-size="16" fill="#8b949e" font-family="Helvetica, Arial, sans-serif">Stream live, animated UI cards from any node or tool &#8212; with any LLM, or none.</text>
    <!-- install pill -->
    <g transform="translate(4, 120)">
      <rect width="270" height="42" rx="11" fill="#16191f" stroke="#2d333b"/>
      <text x="18" y="27" font-size="16" font-family="'Courier New', monospace" fill="#5eead4">$ pip install <tspan fill="#f5b544">dyui</tspan></text>
    </g>
  </g>

  <!-- floating cards motif -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- stat card -->
    <g transform="translate(840, 70)" filter="url(#cardblur)">
      <rect width="200" height="92" rx="14" fill="#16191f" stroke="#2d333b"/>
      <rect width="3" height="92" rx="2" fill="#5eead4"/>
      <text x="18" y="30" font-size="11" fill="#8b949e">Revenue</text>
      <text x="18" y="64" font-size="34" font-weight="700" fill="#eef1f5" font-family="Georgia, serif">$48.2k</text>
      <text x="150" y="30" font-size="11" fill="#5eead4">+12%</text>
    </g>
    <!-- progress card -->
    <g transform="translate(980, 185)" filter="url(#cardblur)">
      <rect width="180" height="80" rx="14" fill="#16191f" stroke="#2d333b"/>
      <rect width="3" height="80" rx="2" fill="#f5b544"/>
      <text x="18" y="28" font-size="11" fill="#8b949e">Indexing</text>
      <rect x="18" y="40" width="144" height="9" rx="5" fill="#21262d"/>
      <rect x="18" y="40" width="104" height="9" rx="5" fill="#f5b544"/>
      <text x="18" y="68" font-size="10" fill="#9aa3b0">72% &#183; chunk 7/10</text>
    </g>
    <!-- table card -->
    <g transform="translate(800, 230)" filter="url(#cardblur)">
      <rect width="168" height="110" rx="14" fill="#16191f" stroke="#2d333b"/>
      <rect width="3" height="110" rx="2" fill="#ff8a6b"/>
      <text x="16" y="26" font-size="11" fill="#8b949e">Results</text>
      <line x1="16" y1="40" x2="152" y2="40" stroke="#2d333b"/>
      <line x1="16" y1="64" x2="152" y2="64" stroke="#23282f"/>
      <line x1="16" y1="86" x2="152" y2="86" stroke="#23282f"/>
      <rect x="16" y="48" width="70" height="8" rx="4" fill="#2f343c"/><rect x="120" y="48" width="32" height="8" rx="4" fill="#3a2f24"/>
      <rect x="16" y="71" width="84" height="8" rx="4" fill="#2f343c"/><rect x="120" y="71" width="32" height="8" rx="4" fill="#24322f"/>
      <rect x="16" y="93" width="60" height="8" rx="4" fill="#2f343c"/><rect x="120" y="93" width="32" height="8" rx="4" fill="#3a2f24"/>
    </g>
  </g>
</svg>
